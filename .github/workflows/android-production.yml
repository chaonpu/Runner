name: APK 构建与签名（手动）

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "构建并签名（不勾选仅检查）"
        type: boolean
        required: true
        default: false
      resume:
        description: "继续旧任务（新构建勿选，需填原 SHA）"
        type: boolean
        required: true
        default: false
      source_sha:
        description: "源码 SHA（通常留空；续跑填原40位）"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-controlled-android-private-build
  cancel-in-progress: false

jobs:
  android:
    name: Verify Test source then isolated Windows APK signing
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      EXECUTE: ${{ inputs.execute }}
      RESUME: ${{ inputs.resume }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout only trusted public coordinator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline safety regressions
        run: python3 -m unittest discover -s tests -p test_android_production.py -v
      - name: Coordinate exact Test and private signer runs
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-sha "$SOURCE_SHA")
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          if [[ "$RESUME" == 'true' ]]; then args+=(--resume); fi
          python3 -m scheduler.android_production "${args[@]}"
      - name: Explain next manual step
        if: always()
        run: |
          echo '### APK 构建与签名' >> "$GITHUB_STEP_SUMMARY"
          echo '本次构建与签名全部成功后，即可继续正式发布。' >> "$GITHUB_STEP_SUMMARY"
          echo '下一步：打开「APK 正式发布」，勾选执行。版本与源码自动读取，更新说明可留空。' >> "$GITHUB_STEP_SUMMARY"
