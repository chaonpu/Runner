name: APK 构建与签名（手动）

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "构建并签名（不勾选仅检查）"
        type: boolean
        required: true
        default: false
      live_smoke:
        description: "构建后验证实时行情（失败则停止签名）"
        type: boolean
        required: true
        default: true
      resume:
        description: "继续旧任务（新构建勿选，需填原 SHA）"
        type: boolean
        required: true
        default: false
      recover_live_validation:
        description: "已复核在线验证失败，限一次全量重建（须选续跑）"
        type: boolean
        required: true
        default: false
      source_sha:
        description: "源码 SHA（通常留空；续跑填原40位）"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-controlled-android-private-build
  cancel-in-progress: false

jobs:
  android:
    name: Verify Test source then isolated Windows APK signing
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
      CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      CHAONPU_SOURCE_READ_TOKEN: ${{ secrets.CHAONPU_SOURCE_READ_TOKEN }}
      EXECUTE: ${{ inputs.execute }}
      LIVE_SMOKE: ${{ inputs.live_smoke }}
      RESUME: ${{ inputs.resume }}
      RECOVER_LIVE_VALIDATION: ${{ inputs.recover_live_validation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout only trusted public coordinator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline safety regressions
        run: |
          python3 -m unittest discover -s tests -p test_android_production.py -v
          python3 -m unittest discover -s tests -p test_android_live_validation.py -v
          python3 -m unittest discover -s tests -p test_android_live_recovery.py -v
          python3 tools/private_release_transport.py self-test
          python3 -m unittest discover -s tests -p test_private_release_transport.py -v
          python3 -m unittest discover -s tests -p 'test_android_signing_recovery.py' -v
          python3 -m unittest discover -s tests -p 'test_android_private_release.py' -v
          python3 -m unittest discover -s tests -p 'test_apk_stage.py' -v
          # Check static workflow contracts; an active stock-session permit is
          # mutable strategy state and is enforced by the strategy workflows.
          python3 -m unittest discover -s tests -p 'test_workflow_contract.py' -v \
            -k test_exactly_four_manual_workflows \
            -k test_maintenance_schedule_and_permissions \
            -k test_calendar_health_is_read_only_and_cannot_dispatch_business \
            -k test_only_maintenance_and_health_have_automatic_triggers \
            -k test_strategy_market_and_cleanup \
            -k test_publication_is_separate_and_no_source_checkout
      - name: Coordinate exact Test and private signer runs
        id: coordinate
        shell: bash
        env:
          PREFER_GIT_API_MIRROR: "1"
        run: |
          set -euo pipefail
          args=(--source-sha "$SOURCE_SHA")
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          if [[ "$LIVE_SMOKE" == 'true' ]]; then args+=(--live-smoke); fi
          if [[ "$RESUME" == 'true' ]]; then args+=(--resume); fi
          if [[ "$RECOVER_LIVE_VALIDATION" == 'true' ]]; then args+=(--recover-live-validation); fi
          python3 -m scheduler.android_production "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/entry-result.jsonl"
      - name: Explain next manual step
        if: always()
        shell: bash
        run: |
          echo '### APK 构建与签名' >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.coordinate.outcome }}" == 'success' && "$EXECUTE" == 'true' ]]; then
            if grep -q '"status": "skipped"' "$RUNNER_TEMP/entry-result.jsonl"; then
              echo '该源码 SHA 已完成构建与签名，本次已跳过重复构建；无需重新签名。' >> "$GITHUB_STEP_SUMMARY"
              echo '原始 Test 与签名 Run ID 请见上方已登记结果；未发生新的下游派发。' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '源码校验、编译、签名链和受控产物验证已全部通过。' >> "$GITHUB_STEP_SUMMARY"
              if grep -q '"liveValidation": "passed"' "$RUNNER_TEMP/entry-result.jsonl"; then
                echo '实时行情验证已在私有 Test 执行并通过；数量与详细报告见对应 Test Run。' >> "$GITHUB_STEP_SUMMARY"
              fi
              echo '可以打开「APK 正式发布」，由发布工作流再次验证私有来源和 APK 证书。' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$EXECUTE" != 'true' ]]; then
            echo '仅执行只读检查；未创建、编译或签名 APK，不允许发布。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '构建/签名未完成，不允许进入正式发布。' >> "$GITHUB_STEP_SUMMARY"
            echo '查看上方结构化 failureClass 与 state/android-production.json 的 lastFailure；网络故障已经在同一私有运行内限次重试，不会自动改用旧源码。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show authoritative entry outcome (not GitHub green alone)
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          ENTRY_PREVIEW: ${{ inputs.execute != true }}
        run: |
          python3 -m scheduler.entry_result --entry android_build \
            --result "$JOB_RESULT" --preview "$ENTRY_PREVIEW" \
            --log "$RUNNER_TEMP/entry-result.jsonl"
