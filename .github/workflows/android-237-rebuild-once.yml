name: One-time APK 2.3.7 verified build and signing
"on":
  push:
    branches: [main]
    paths: [.github/workflows/android-237-rebuild-once.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-controlled-android-private-build
  cancel-in-progress: false

jobs:
  build-sign:
    name: Rebuild pinned 2.3.7 via production scheduler
    if: github.ref == 'refs/heads/main' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
      CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      SOURCE_SHA: 73a9ce4c933f1a6fec971c83905f84e524a8cd5e
    steps:
      - name: Checkout trusted coordinator at exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify coordinator safety regressions
        run: python3 -m unittest discover -s tests -p test_android_production.py -v
      - name: Build and sign exact 2.3.7 source (no publication)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scheduler.android_production --source-sha "$SOURCE_SHA" --execute 2>&1 | tee "$RUNNER_TEMP/entry-result.jsonl"
      - name: Record actual business result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          python3 -m scheduler.entry_result --entry android_build --result "$JOB_RESULT" --log "$RUNNER_TEMP/entry-result.jsonl"
