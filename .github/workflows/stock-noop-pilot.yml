name: Stock on-demand dispatch and foreground monitoring (NO strategy)

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: "Pilot identity (YYYY-MM-DD). One no-op canary per date; NEVER runs strategy."
        required: true
        type: string
      mode:
        description: "dispatch = register/dispatch/watch; monitor_only = resume watching existing Run ID without dispatch"
        required: true
        type: choice
        options: [dispatch, monitor_only]
        default: dispatch

permissions:
  contents: write

concurrency:
  group: runner-stock-noop-pilot-registry
  cancel-in-progress: false

jobs:
  dispatch-one-canary:
    name: Dispatch once, watch same Run ID until completion, then stop
    if: github.ref == 'refs/heads/main' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted public coordinator only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
      - name: Validate idempotent pilot safety before requesting any write
        run: |
          python3 -m unittest discover -s tests -p 'test_pilot_*.py' -v
          python3 -m unittest discover -s tests -p 'test_canary_dispatch.py' -v
      - name: Reserve date before issuing no-op cross-repository dispatch
        if: inputs.mode == 'dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          PILOT_DATE: ${{ inputs.business_date }}
        run: |
          set -euo pipefail
          python3 -m scheduler.pilot_registry --date "$PILOT_DATE"
      - name: Foreground monitor exact Stock Run until completed or safely stopped
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          PILOT_MODE: ${{ inputs.mode }}
          PILOT_DATE: ${{ inputs.business_date }}
        run: |
          set -euo pipefail
          python3 -m scheduler.foreground_watch --date "$PILOT_DATE"

      - name: Atomically record confirmed result before this workflow exits
        if: always() && steps.watch.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
        run: python3 -m scheduler.pilot_finalize

      - name: Confirm no background watcher or business operation remains
        if: success()
        run: |
          echo 'Dispatcher ended after exact Stock no-op Run completed.'
          echo 'No schedule, daemon, strategy, database write or APK publication.'
