name: 私有仓库历史清理（每日）

on:
  push:
    branches: [main]
    paths: ['config/retired-workflow-cleanup.json']
  schedule:
    # Daily 04:30 Asia/Shanghai = previous day 20:30 UTC.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预览，不删除运行记录'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: private-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'chaonpu/Runner' && github.ref == 'refs/heads/main' && github.actor == 'chaonpu' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted cleanup policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify deletion boundaries
        run: python3 -m unittest discover -s tests -p test_private_history_cleanup.py -v
      - name: Clean retired workflow history or preview
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          EXECUTE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python3 tools/private_history_cleanup.py "${args[@]}"
      - name: Preserve cleanup counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-history-cleanup-result
          path: private-history-cleanup-result.json
          if-no-files-found: ignore
          retention-days: 7

  retired-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'chaonpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repository: [chaonpu/Runner, chaonpu/Stock]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact-run cleanup boundaries
        run: node --test tests/retired_run_cleanup.test.cjs
      - name: Delete only the approved retired run records
        uses: actions/github-script@v7
        env:
          CLEANUP_TARGET: ${{ matrix.repository }}
        with:
          github-token: ${{ matrix.repository == 'chaonpu/Stock' && secrets.CHAONPU_ACTIONS_READ_TOKEN || github.token }}
          script: |
            const clean = require('./tools/retired_run_cleanup.cjs');
            const plan = require('./config/retired-workflow-cleanup.json');
            const result = await clean({github, context, plan, target: process.env.CLEANUP_TARGET});
            await core.summary.addHeading('Retired workflow history cleanup').addCodeBlock(JSON.stringify(result, null, 2)).write();
