name: Unified on-demand build and strategy preflight

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Allowlisted business task (dry-run, no dispatch)"
        required: true
        type: choice
        options:
          - stock_a
          - stock_us
          - stock_etf
          - android
      business_date:
        description: "YYYY-MM-DD, required for Stock tasks"
        required: false
        type: string
      source_sha:
        description: "Exact Test/main SHA, required for Android"
        required: false
        type: string
      source_version:
        description: "Reserved: no database or APK publication dispatch from this coordinator"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runner-preflight-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    name: Read account usage and real Runner status; NO dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Use trusted public coordinator source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
      - name: Verify public fail-closed routing
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Read only billing, Actions and runner APIs
        env:
          TASK: ${{ inputs.task }}
          BUSINESS_DATE: ${{ inputs.business_date }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: |
          python3 -m scheduler.preflight --task "$TASK" --business-date "$BUSINESS_DATE" --source-sha "$SOURCE_SHA" --source-version "$SOURCE_VERSION"
      - name: Confirm no sensitive or side-effect actions
        run: |
          echo 'Coordinator used GitHub-hosted runner.'
          echo 'No private repo checkout, workflow dispatch, cancellation, ledger change or release.'
