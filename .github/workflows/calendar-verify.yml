name: 交易日历接入验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/calendar-acceptance.json', '.github/workflows/calendar-verify.yml']

permissions:
  contents: read

concurrency:
  group: calendar-integration-validation
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate coordinator date, readiness and immutable calendar contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_exchange_schedule.py' -v
          python3 -m unittest discover -s tests -p 'test_calendar_integration.py' -v
          python3 -m unittest discover -s tests -p 'test_production_*.py' -q
      - name: Read and verify current public calendar bytes
        run: python3 -m scheduler.calendar_runtime --cache "$RUNNER_TEMP/calendar-snapshot.json"
  private-validation:
    needs: backend
    strategy:
      fail-fast: false
      matrix: {target: [stock, app]}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Run existing private calendar or Android validation only
        env:
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
        run: python3 -u tools/calendar_acceptance.py "${{ matrix.target }}"
