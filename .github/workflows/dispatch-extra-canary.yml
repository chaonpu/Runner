name: Verify private Android signer dispatch scope (no-op)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Only private Android signer canary"
        required: true
        default: signer
        type: choice
        options: [signer]

permissions:
  contents: read

concurrency:
  group: cross-repository-private-signer-canary
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify only no-op canary dispatches permitted
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify private signer repository write scope without signing
        if: inputs.target == 'signer'
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
        run: python3 -m scheduler.canary_dispatch --target signer
      - name: State explicit nonproduction result
        run: echo 'No strategy, ledger, APK signing, publication or private source download.'
