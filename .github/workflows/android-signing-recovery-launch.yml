name: Reviewed private Android signing-only recovery

on:
  push:
    branches: [main]
    paths: ["config/android-signing-recovery.json"]

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-controlled-android-private-build
  cancel-in-progress: false

jobs:
  retry-signing-only:
    name: Recover one failed-before-keys private signer
    if: github.actor == 'chaonpu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Check out immutable reviewed public coordinator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test recovery guards without dispatch
        run: python3 -m unittest discover -s tests -p test_android_signing_recovery.py -v
      - name: Verify prior failed-before-keys job and recover only its signer
        run: python3 -m scheduler.android_signing_recovery
      - name: Confirm public APK remains locked
        if: always()
        run: echo 'No Test rebuild, public APK or update manifest is dispatched.'
