name: Android same-run Test handoff recovery regression (temporary)
on:
  push:
    branches:
      - fix/android-test-handoff-rerun-20261112
permissions:
  contents: read
jobs:
  offline-only:
    if: github.repository == 'chaonpu/Runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile Python coordinator source without secrets
        run: python3 -m py_compile scheduler/android_production.py tests/test_android_production.py
      - name: Run original and same-run handoff recovery regressions
        run: python3 -m unittest -q \
          tests/test_android_production.py \
          tests/test_android_verified_test_recovery.py \
          tests/test_android_live_validation.py \
          tests/test_android_live_recovery.py \
          tests/test_android_signing_recovery.py \
          tests/test_android_private_release.py \
          tests/test_apk_stage.py
