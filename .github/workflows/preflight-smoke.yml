name: Coordinator cloud preflight live smoke (read only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preflight-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
      - name: Read Stock workflow and Chaonpu account status
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: python3 -m scheduler.preflight --task stock_us --business-date 2026-10-16
      - name: Read Test, private signer and two Windows Runner statuses
        env:
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
          TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: python3 -m scheduler.preflight --task android --source-sha c8f606ef20167de9f42de3340fab92634bffe51d
      - name: Confirm no dispatch
        run: echo 'Cloud preflight successfully ran independent of local Windows; all output is advisory.'
