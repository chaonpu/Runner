name: Verify trusted postpublication recovery (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'scheduler/production_recovery.py'
      - 'tests/test_production_recovery.py'
      - '.github/workflows/verify-postpublication-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify original run identity and safe cloud recovery scope
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute pure registry recovery regression tests
        run: python3 -m unittest -v tests/test_production_recovery.py
