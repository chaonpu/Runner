name: Controlled Stock production coordinator

on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [stock_a, stock_us]
        required: true
      business_date:
        description: "Blank uses the latest completed official-calendar session"
        type: string
        default: ""
      publication_mode:
        description: "Formal report follows native session rules; catchup writes theoretical data only"
        type: choice
        options: [formal, theoretical_catchup]
        default: formal
      execute:
        description: "Execute this one task with a temporary permit; false is read only"
        type: boolean
        default: false
      bootstrap_run_id:
        description: "Internal reviewed-launch provenance; leave blank for administrator manual runs"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-production-single-task
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (github.actor == 'chaonpu' || (github.actor == 'github-actions[bot]' && inputs.bootstrap_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      BOOTSTRAP_RUN_ID: ${{ inputs.bootstrap_run_id }}
      REQUEST_TASK: ${{ inputs.task }}
      REQUEST_PUBLICATION_MODE: ${{ inputs.publication_mode }}
      REQUEST_BUSINESS_DATE: ${{ inputs.business_date }}
    steps:
      - name: Checkout trusted public coordinator only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Coordinate one exact task or perform a read-only preview
        env:
          TASK: ${{ inputs.task }}
          BUSINESS_DATE: ${{ inputs.business_date }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
          EXECUTE: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--task "$TASK" --business-date "$BUSINESS_DATE" --publication-mode "$PUBLICATION_MODE")
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python3 -m scheduler.production_coordinator "${args[@]}"
      - name: Close only this coordinator's temporary permit
        if: always() && inputs.execute == true
        run: python3 -m scheduler.production_lease
