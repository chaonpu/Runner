name: A股策略（手动）

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "运行策略／自动补算（不勾选仅检查）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-production-single-task
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      REQUEST_TASK: stock_a
    steps:
      - name: Checkout trusted public coordinator only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Automatically select session and coordinate or preview
        env:
          TASK: stock_a
          EXECUTE: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--task "$TASK")
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python3 -m scheduler.production_coordinator "${args[@]}"
      - name: Close only this coordinator's temporary permit
        if: always() && inputs.execute == true
        run: python3 -m scheduler.production_lease
