name: Temporary read-only coordinator retry regression

on:
  push:
    branches:
      - fix/attested-database-prebusiness-recovery-20261027

permissions:
  contents: read

jobs:
  proof-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact submitted coordinator SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run coordinator prebusiness and registry unit regressions
        env:
          PYTHONUTF8: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_prebusiness_retry.py' -v
          python3 -m unittest discover -s tests -p 'test_production_ports.py' -v
          python3 -m unittest discover -s tests -p 'test_production_completion.py' -v
          python3 -m unittest discover -s tests -p 'test_production_registry.py' -v
          python3 -m unittest discover -s tests -p 'test_production_auto.py' -v
