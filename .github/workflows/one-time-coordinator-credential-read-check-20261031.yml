name: One-time read-only coordinator credential capability audit
on:
  push:
    paths:
      - .github/workflows/one-time-coordinator-credential-read-check-20261031.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'chaonpu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      USER_ACTIONS_CREDENTIAL: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
    steps:
      - name: Verify existing user Actions token can read official workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('USER_ACTIONS_CREDENTIAL','')
          if not token:
              print(json.dumps({'tokenPresent':False,'privateDataRead':False}))
              raise SystemExit(0)
          paths=['https://api.github.com/user',
                 'https://api.github.com/repos/chaonpu/Runner/actions/workflows/stock-us.yml',
                 'https://api.github.com/repos/chaonpu/Stock/actions/workflows/production-readiness-us.yml']
          for i,url in enumerate(paths):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'ziwuxilv-readonly-permission-probe'})
              try:
                  with urllib.request.urlopen(request,timeout=12) as resp:
                      status=resp.status
                      body=resp.read(20480)
                  login=json.loads(body).get('login','') if i==0 else ''
              except urllib.error.HTTPError as exc:
                  status=exc.code;login=''
              except Exception:
                  status='connection_unavailable';login=''
              print(json.dumps({'check':i,'httpStatus':status,'userIsChaonpu':login=='chaonpu' if i==0 else None},sort_keys=True))
          PY
