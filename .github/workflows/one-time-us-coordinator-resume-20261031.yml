name: One-time verified US coordinator resume 2026-10-31
on:
  push:
    paths:
      - .github/workflows/one-time-us-coordinator-resume-20261031.yml
permissions:
  contents: read
jobs:
  dispatch-original:
    if: github.actor == 'chaonpu' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'One-time verified US coordinator resume 2026-10-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      ACTIONS_USER_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
    steps:
      - name: Dispatch original protected US coordinator exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('ACTIONS_USER_TOKEN','')
          if not token:
              raise SystemExit('Authorized user Actions credential unavailable; no dispatch')
          payload = json.dumps({'ref':'main','return_run_details':True,
                                'inputs':{'execute':'true'}}).encode('utf-8')
          request = urllib.request.Request(
              'https://api.github.com/repos/chaonpu/Runner/actions/workflows/stock-us.yml/dispatches',
              data=payload, method='POST',
              headers={'Authorization':'Bearer '+token,
                       'Accept':'application/vnd.github+json',
                       'Content-Type':'application/json',
                       'X-GitHub-Api-Version':'2026-03-10',
                       'User-Agent':'ziwuxilv-one-time-original-us-coordinator'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          try:
              with urllib.request.build_opener(NoRedirect()).open(request,timeout=25) as response:
                  status=response.status
                  data=response.read(20000)
          except Exception:
              raise SystemExit('Original coordinator dispatch outcome uncertain; no retry')
          if status not in (200,201):
              raise SystemExit('Original coordinator dispatch not confirmed; no retry')
          item=json.loads(data)
          rid=item.get('workflow_run_id')
          if not isinstance(rid,int) or rid<=0:
              raise SystemExit('Original coordinator dispatch returned no verified run id; no retry')
          print(json.dumps({'originalCoordinatorRunId':rid,
                            'dispatchCount':1,'formalCoordinatorPath':'stock-us.yml',
                            'publicationNotYetVerified':True}))
          PY
