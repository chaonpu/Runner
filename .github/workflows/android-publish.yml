name: APK 发布（手动）

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "预览存Runner；正式发ziwuxilv"
        type: choice
        required: true
        default: "预览"
        options:
          - "预览"
          - "正式"
      update_log:
        description: "留空自动读取本版更新内容"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-manual-apk-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      CHAONPU_SOURCE_READ_TOKEN: ${{ secrets.CHAONPU_SOURCE_READ_TOKEN }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      UPDATE_LOG: ${{ inputs.update_log }}
      RELEASE_MODE: ${{ inputs.release_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication guard and mode-selection regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*publish*.py' -v
          python3 -m unittest discover -s tests -p 'test_entry_result.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_contract.py' -v
          python3 tools/private_release_transport.py self-test
          python3 -m unittest discover -s tests -p 'test_android_private_release.py' -v
          python3 -m unittest discover -s tests -p 'test_apk_stage.py' -v
      - name: Verify signed APK and execute selected release mode
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            "预览") mode=preview ;;
            "正式") mode=formal ;;
            *) echo "::error::无效的 APK 发布方式"; exit 2 ;;
          esac
          python3 -m scheduler.android_publish --release-mode "$mode" 2>&1 | tee "$RUNNER_TEMP/entry-result.jsonl"
      - name: Show authoritative entry outcome (not GitHub green alone)
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          python3 -m scheduler.entry_result --entry android_publish \
            --result "$JOB_RESULT" \
            --log "$RUNNER_TEMP/entry-result.jsonl"
