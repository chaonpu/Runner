name: APK 正式发布（手动）

on:
  workflow_dispatch:
    inputs:
      update_log:
        description: "更新说明（可留空，自动填写版本更新说明）"
        type: string
        required: false
        default: ""
      execute:
        description: "勾选后真实操作；不勾选只检查，不公开APK"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-manual-apk-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      UPDATE_LOG: ${{ inputs.update_log }}
      EXECUTE: ${{ inputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication guard regressions
        run: python3 -m unittest discover -s tests -p 'test_*publish*.py' -v
      - name: Automatically select and verify signed APK, then publish or preview
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python3 -m scheduler.android_publish "${args[@]}"
      - name: Downloadable public release request
        if: always() && inputs.execute == true
        uses: actions/upload-artifact@v4
        with:
          name: apk-publication-request
          path: publication-output/android-publish-request.json
          if-no-files-found: ignore
          retention-days: 7
