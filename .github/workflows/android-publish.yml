name: APK 正式发布（手动）

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "正式发布（不勾选仅检查）"
        type: boolean
        default: false
      update_log:
        description: "更新说明（留空采用本次源码的具体更新）"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-manual-apk-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      UPDATE_LOG: ${{ inputs.update_log }}
      EXECUTE: ${{ inputs.execute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication guard regressions
        run: python3 -m unittest discover -s tests -p 'test_*publish*.py' -v
      - name: Automatically select and verify signed APK, then publish or preview
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EXECUTE" == 'true' ]]; then args+=(--execute); fi
          python3 -m scheduler.android_publish "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/entry-result.jsonl"
      - name: Downloadable public release request
        if: always() && inputs.execute == true
        uses: actions/upload-artifact@v4
        with:
          name: apk-publication-request
          path: publication-output/android-publish-request.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Show authoritative entry outcome (not GitHub green alone)
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          ENTRY_PREVIEW: ${{ inputs.execute != true }}
        run: |
          python3 -m scheduler.entry_result --entry android_publish \
            --result "$JOB_RESULT" --preview "$ENTRY_PREVIEW" \
            --log "$RUNNER_TEMP/entry-result.jsonl"
