name: Verify production task registry state (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'state/tasks.json'
      - 'scheduler/production_registry.py'
      - 'scheduler/production_recovery.py'
      - '.github/workflows/verify-production-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable task provenance and recovery metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current registry state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scheduler.production_registry import validate
          config=json.loads(Path('config/repositories.json').read_text())
          state=json.loads(Path('state/tasks.json').read_text())
          validate(config,state)
          rows=[r for r in state['tasks'] if r['id']=='stock_a:2026-11-11']
          assert len(rows)==1
          row=rows[0]
          assert row['runId']==42976546025
          assert row['status']=='verified'
          assert row['completionMode']=='recovered_original_commit'
          assert row['completionRunId']==42980280789
          print('Public recovery task registry validated without any writes')
          PY
      - name: Verify safety contract regression tests
        run: python3 -m unittest -q tests/test_production_recovery.py
