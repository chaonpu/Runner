name: Verify Android dispatch gate fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-android-idle-guard.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify filtered workflow statuses remain fail-closed
        run: python3 -m unittest discover -s tests -p test_active_run_filters.py -v
      - name: Verify Android coordinator and concurrency regressions
        run: python3 -m unittest discover -s tests -p test_android_production.py -v
