name: Launch reviewed Android private build and signing

on:
  push:
    branches: [main]
    paths: ["config/android-launch-request.json"]

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-controlled-android-private-build
  cancel-in-progress: false

jobs:
  private-build-sign:
    if: github.actor == 'chaonpu' && github.ref == 'refs/heads/main'
    name: One approved Test commit - private signing only
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
      TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
      TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
      TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
      CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
      RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout immutable approved public request and coordinator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Validate launch guards before private dispatch
        run: python3 -m unittest discover -s tests -p 'test_android_launch_request.py' -v
      - name: Verify exact reviewed request and coordinate private build/sign
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scheduler.android_launch_request
      - name: Public APK publication is outside this workflow
        if: always()
        run: echo 'No APK or version manifest published. Private source and keystore stay private.'
