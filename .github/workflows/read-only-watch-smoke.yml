name: One-time read-only live foreground watch verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/read-only-watch-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public watcher policy only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify foreground watcher against already-completed Stock canary
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scheduler.foreground_watch import observe
          from scheduler.probes import GitHubReadOnly
          state=json.loads(Path("state/pilot_runs.json").read_text(encoding="utf-8"))
          row=next(r for r in state["tasks"] if r["id"]=="pilot:stock:2026-10-17")
          assert row["runId"]==38961249562
          # In-memory only: re-observe the known past run, never edit registry.
          trial=dict(row,status="dispatched")
          assert os.environ.get("CHAONPU_ACTIONS_READ_TOKEN")
          getter=GitHubReadOnly(os.environ["CHAONPU_ACTIONS_READ_TOKEN"]).get
          assert observe(trial,getter,interval=15,deadline_seconds=60)=="completed_success"
          print("Read-only live foreground poll verified exact historical Stock no-op Run.")
          print("No dispatch, persistent-state mutation, strategy or database operation.")
          PY
