name: A股等权指数公开行情实测（独立实验分支）
on:
  push:
    branches: [probe-a-share-equal-index-20261113]
    paths: [.github/workflows/probe-a-share-equal-index-20261113.yml]
permissions:
  contents: read
jobs:
  index-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify server-side market mean and all-A board time
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,html,re,datetime,json,time
          cases=[("cfi_average","https://quoteimg.cfi.cn/cfi_aSharesRate.aspx"),("tonghuashun_883957","https://q.10jqka.com.cn/thshy/detail/code/883957/")]
          for name,url in cases:
           t=time.monotonic()
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.10jqka.com.cn/" if "tonghuashun" in name else "https://www.cfi.cn/"})
            with urllib.request.urlopen(req,timeout=10) as response:
             raw=response.read(250000);headers=dict(response.headers);code=response.status
            # Try Chinese legacy encoding when the page lacks UTF-8.
            candidates={enc:raw.decode(enc,errors="replace") for enc in ["utf-8","gb18030"]}
            enc=max(candidates,key=lambda e: sum(candidates[e].count(x) for x in ["全A","涨幅","板块","上涨","同花顺","涨跌"]))
            body=candidates[enc]
            clean=html.unescape(re.sub(r"<[^>]*>"," ",re.sub(r"<(script|style)[^>]*>.*?</\1>"," ",body,flags=re.I|re.S)))
            clean=re.sub(r"\s+"," ",clean)
            evidence={}
            for pattern in [r"2026.{0,8}11.{0,6}13.{0,15}\d{1,2}:\d{2}",r"涨幅平均值.{0,35}",r"涨幅中位数.{0,35}",r"同花顺全A.{0,60}",r"板块涨幅.{0,30}",r"涨跌家数.{0,60}",r"上涨.{0,65}",r"下跌.{0,65}",r"全部A股.{0,50}",r"北交所.{0,40}"]:
             m=re.search(pattern,clean);evidence[pattern]=m.group(0) if m else None
            print("ROUND3_RESULT",json.dumps({"name":name,"http":code,"elapsed_ms":round(1000*(time.monotonic()-t)),"size":len(raw),"codec":enc,"http_date":headers.get("Date"),"last_modified":headers.get("Last-Modified"),"cache_control":headers.get("Cache-Control"),"evidence":evidence,"preview":clean[:200]},ensure_ascii=False),flush=True)
           except Exception as e:print("ROUND3_RESULT",json.dumps({"name":name,"error":str(e)[:220]}),flush=True)
          PY
