name: 同花顺市场广度缺失字段实测
on:
  push:
    branches: [probe-a-share-equal-index-20261113]
    paths: [.github/workflows/probe-a-share-equal-index-20261113.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare HTTP HTTPS Android headers and headless browser
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,http.cookiejar,subprocess,re,time,json,datetime,shutil,html
          root="https://q.10jqka.com.cn/"
          url="https://q.10jqka.com.cn/api.php?t=indexflash"
          items=[("https_desktop",url,False,False),("https_android",url,True,False),("http_desktop","http://q.10jqka.com.cn/api.php?t=indexflash",False,False),("https_after_home",url,False,True)]
          ua_desktop="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          ua_android="Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36"
          def test(item):
           n,u,m,warm=item;t=time.monotonic()
           op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
           headers={"User-Agent":ua_android if m else ua_desktop,"Accept":"*/*","Accept-Language":"zh-CN,zh;q=0.9","Referer":root}
           if warm:
            try:
             with op.open(urllib.request.Request(root,headers=headers),timeout=10) as h: h.read(200)
            except Exception as e:pass
           try:
            with op.open(urllib.request.Request(u,headers=headers),timeout=10) as h:
             b=h.read(60000);status=h.status;hds=dict(h.headers);endurl=h.url
            body=b.decode("gb18030","replace");result={"name":n,"status":status,"final_url":endurl,"type":hds.get("Content-Type"),"bytes":len(b),"seconds":round(time.monotonic()-t,2),"preview":body[:500]}
            if body.lstrip().startswith(("{","[")):
             try:
              obj=json.loads(body);result["keys"]=list(obj) if isinstance(obj,dict) else ["ARRAY"];result["data"]={k:(list(v) if isinstance(v,dict) else str(v)[:100]) for k,v in obj.items()} if isinstance(obj,dict) else None
             except Exception as e:result["parse_error"]=str(e)
            return result
           except urllib.error.HTTPError as e:return {"name":n,"status":e.code,"url":e.url,"bytes":None,"body":e.read(450).decode("utf-8","replace"),"seconds":round(time.monotonic()-t,2)}
           except Exception as e:return {"name":n,"error":repr(e)[:200],"seconds":round(time.monotonic()-t,2)}
          print("TEST_AT",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          for item in items:print("TRANSPORT_RESULT",json.dumps(test(item),ensure_ascii=False),flush=True)
          bin=shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("chromium-browser")
          print("CHROME_AVAILABLE",bin,flush=True)
          if bin:
           for url2 in ["https://q.10jqka.com.cn/","http://q.10jqka.com.cn/"]:
            try:
             t=time.monotonic()
             p=subprocess.run([bin,"--headless=new","--no-sandbox","--disable-gpu","--disable-dev-shm-usage","--disable-background-networking","--virtual-time-budget=8000","--dump-dom",url2],capture_output=True,text=True,timeout=35)
             s=p.stdout
             block=re.search(r'<div class="hcharts-list".*?</div>\s*</div>',s,re.S)
             stats={}
             for word in ["c-rise","c-fall","zdfb","zdt","涨停","跌停"]:
              matches=list(re.finditer(re.escape(word),s,re.I))
              stats[word]={"n":len(matches),"first":re.sub(r'<[^>]+>',' ',s[max(0,matches[0].start()-90):matches[0].start()+130])[:150] if matches else None}
             print("CHROME_RESULT",json.dumps({"url":url2,"returncode":p.returncode,"seconds":round(time.monotonic()-t,2),"len":len(s),"stats":stats,"stderr_tail":p.stderr[-400:]},ensure_ascii=False),flush=True)
            except Exception as e:print("CHROME_RESULT",json.dumps({"url":url2,"error":repr(e)[:250]}),flush=True)
          PY
