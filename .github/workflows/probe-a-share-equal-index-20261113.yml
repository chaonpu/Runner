name: 同花顺市场广度缺失字段实测
on:
  push:
    branches: [probe-a-share-equal-index-20261113]
    paths: [.github/workflows/probe-a-share-equal-index-20261113.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace public THS summary JavaScript endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re,json,time,concurrent.futures
          urls=[
           ("q_index2","https://s.thsi.cn/js/q/newq/index2.js"),
           ("q_hssc","https://s.thsi.cn/website/datacenter/rzrq/hssc_v1.min.js"),
           ("q_ths_index","https://s.thsi.cn/cb?js/home/;ths_core.min.js;ths_quote.min.js;ths_index_v3.3.min.js"),
           ("q_flash","https://s.thsi.cn/cb?js/q/newq/flash.min.js"),
           ("q_common","https://s.thsi.cn/js/q/newq/common_v2.1.min.js"),
          ]
          def get(item):
           n,u=item
           try:
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Referer":"https://q.10jqka.com.cn/"})
            with urllib.request.urlopen(req,timeout=10) as f:b=f.read(700000);status=f.status
            s=b.decode("utf-8","replace");o={"name":n,"status":status,"bytes":len(b)}
            for word in ["zdfb","zdt","zt","dt","chart","涨跌分布","涨停","跌停","flat","upDown","updown","zdf","rise","fall","data.10jqka","q.10jqka","d.10jqka","thsData","Ajax","ajax"]:
             matches=list(re.finditer(re.escape(word),s,re.I))
             o["hits_"+word]={"n":len(matches),"examples":[s[max(0,m.start()-145):m.start()+180][:325].replace("\n"," ") for m in matches[:2]]}
            o["urls"]=list(dict.fromkeys(re.findall(r'(?:https?:)?//[a-zA-Z0-9_.-]+(?:/[A-Za-z0-9_/?=+%&.;:{}-]{3,})?',s)))[:40]
            return o
           except Exception as e:return {"name":n,"error":type(e).__name__+":"+str(e)[:120]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
           for r in ex.map(get,urls):print("THS_JS_RESULT",json.dumps(r,ensure_ascii=False),flush=True)
          PY
