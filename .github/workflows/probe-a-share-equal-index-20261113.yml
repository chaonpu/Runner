name: 同花顺市场广度缺失字段实测
on:
  push:
    branches: [probe-a-share-equal-index-20261113]
    paths: [.github/workflows/probe-a-share-equal-index-20261113.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe THS indexflash endpoint directly
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re,json,time,datetime
          u="https://q.10jqka.com.cn/api.php?t=indexflash&"
          urls=[("ths_indexflash_https",u),("ths_hssc_script","https://s.thsi.cn/website/datacenter/rzrq/hssc_v1.min.js")]
          for n,url in urls:
           t=time.monotonic()
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://q.10jqka.com.cn/","Accept":"application/json,text/plain,*/*","Cache-Control":"no-cache"})
            with urllib.request.urlopen(req,timeout=10) as r:
             raw=r.read(300000);status=r.status;head=dict(r.headers)
            body=raw.decode("utf-8","replace")
            o={"name":n,"http":status,"bytes":len(raw),"ms":round(1000*(time.monotonic()-t)),"date":head.get("Date"),"cache_control":head.get("Cache-Control")}
            if n=="ths_indexflash_https":
             o["preview"]=body[:3800]
             try:
              d=json.loads(body)
              o["keys"]=list(d.keys()) if isinstance(d,dict) else "nonobject"
              o["typed"]={k:{"type":type(v).__name__,"length":len(v) if isinstance(v,(dict,list)) else None} for k,v in d.items()} if isinstance(d,dict) else None
             except Exception as e:o["parse_error"]=str(e)[:100]
            else:
             for pat in ["var zdfb_data","function drawAllCharts","zdfb_data =","zdfb_data=","todaydieIH_ztzs","function drawZdfb","function drawZdt","indexflash"]:
              m=re.search(re.escape(pat),body)
              o["source_"+pat]=body[max(0,m.start()-300):m.start()+2300] if m else None
            print("THS_ENDPOINT_RESULT",json.dumps(o,ensure_ascii=False),flush=True)
           except urllib.error.HTTPError as e:print("THS_ENDPOINT_RESULT",json.dumps({"name":n,"http":e.code,"error_body":e.read(500).decode('utf-8','replace')},ensure_ascii=False),flush=True)
           except Exception as e:print("THS_ENDPOINT_RESULT",json.dumps({"name":n,"error":type(e).__name__+":"+str(e)[:200]},ensure_ascii=False),flush=True)
          PY
