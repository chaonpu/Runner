name: A股等权指数公开行情实测（独立实验分支）
on:
  push:
    branches: [probe-a-share-equal-index-20261113]
    paths: [.github/workflows/probe-a-share-equal-index-20261113.yml]
permissions:
  contents: read
jobs:
  index-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe read-only HTTP quotes and control symbols
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.request, urllib.error, datetime, time, re
          cases=[
           ("tencent","https://qt.gtimg.cn/q=sh932535,s_sh932535,sz932535,sh000985,sh000001"),
           ("sina","https://hq.sinajs.cn/list=sh932535,s_sh932535,sz932535,sh000985,sh000001"),
           ("eastmoney_932535_sh","https://push2.eastmoney.com/api/qt/stock/get?secid=1.932535&fields=f43,f57,f58,f60,f169,f170,f86"),
           ("eastmoney_932535_sz","https://push2.eastmoney.com/api/qt/stock/get?secid=0.932535&fields=f43,f57,f58,f60,f169,f170,f86"),
           ("eastmoney_control_000985","https://push2.eastmoney.com/api/qt/stock/get?secid=1.000985&fields=f43,f57,f58,f60,f169,f170,f86"),
           ("csindex_daily","https://www.csindex.com.cn/csindex-home/perf/index-perf?indexCode=932535&startDate=20261112&endDate=20261113"),
           ("changedist","https://api.ashareapi.com/v1/changedist")
          ]
          def call(item):
           name,url=item;t=time.monotonic()
           headers={"User-Agent":"Mozilla/5.0 (compatible; index-equal-weight-probe/1.0)","Accept":"*/*","Cache-Control":"no-cache","Referer":"https://finance.sina.com.cn/" if name=="sina" else ("https://www.csindex.com.cn/" if name=="csindex_daily" else "https://quote.eastmoney.com/")}
           try:
            r=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=9)
            raw=r.read(220000);body=raw.decode("gb18030" if name in ("tencent","sina") else "utf-8",errors="replace")
            result={"name":name,"http":r.status,"elapsed_ms":round((time.monotonic()-t)*1000),"bytes":len(raw)}
            if name=="tencent":
             a=[]
             for line in body.splitlines():
              m=re.search(r'v_([^=]+)="([^"]*)"',line)
              if not m: continue
              f=m.group(2).split("~")
              a.append({"id":m.group(1),"name":f[1] if len(f)>1 else None,"price":f[3] if len(f)>3 else None,"percent":f[32] if len(f)>32 else None,"stamp":f[30] if len(f)>30 else None,"parts":len(f)})
             result["quotes"]=a
            elif name=="sina":
             result["quotes"]=[{"id":m.group(1),"sample":m.group(2)[:130]} for m in re.finditer(r'var hq_str_([^=]+)="([^"]*)"',body)]
            elif name.startswith("eastmoney"):
             obj=json.loads(body);result.update({"rc":obj.get("rc"),"msg":obj.get("msg"),"data":obj.get("data")})
            elif name=="csindex_daily":
             obj=json.loads(body); d=obj.get("data");result.update({"code":obj.get("code"),"rows":len(d) if isinstance(d,list) else None,"latest":d[-2:] if isinstance(d,list) else str(d)[:350]})
            elif name=="changedist":
             obj=json.loads(body);result.update({"ok":obj.get("ok"),"source":obj.get("source"),"structured":str(obj.get("structured"))[:550],"data":str(obj.get("data"))[:140]})
            if (name in ("tencent","sina") and not result.get("quotes")) or (name.startswith("eastmoney") and not result.get("data")):result["preview"]=body[:160]
            return result
           except Exception as e:
            return {"name":name,"error":type(e).__name__+":"+str(e)[:180],"elapsed_ms":round((time.monotonic()-t)*1000)}
          print("PROBE_DATE_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
           for r in ex.map(call,cases):
            print("PROBE_RESULT",json.dumps(r,ensure_ascii=False,default=str),flush=True)
          PY
