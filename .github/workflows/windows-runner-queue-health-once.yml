name: One-shot Windows Test Runner queue health check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-runner-queue-health-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact private Test Windows Runner status and queued jobs
        env:
          PRIVATE_TEST_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.getenv("PRIVATE_TEST_TOKEN","")
          if not token: raise RuntimeError("TEST_RUNNER_READ_TOKEN_MISSING")
          def get(path):
              assert path.startswith("/repos/anwpustudent-lab/Test/")
              req=urllib.request.Request("https://api.github.com"+path,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"ziwuxilv-private-runner-state-check"
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      return json.load(res)
              except urllib.error.HTTPError as e:
                  print("TEST_RUNNER_HEALTH_HTTP",e.code,flush=True)
                  raise RuntimeError("TEST_RUNNER_HEALTH_UNAVAILABLE") from None
          data=get("/repos/anwpustudent-lab/Test/actions/runners?per_page=100")
          nodes=[x for x in data.get("runners",[]) if x.get("name")=="ziwuxilv-test-win"]
          if len(nodes)!=1: raise RuntimeError("EXACT_TEST_RUNNER_NOT_REGISTERED")
          node=nodes[0]
          labels=[s.get("name") for s in node.get("labels",[])]
          print("TEST_RUNNER_STATUS",node.get("status"),flush=True)
          print("TEST_RUNNER_BUSY",node.get("busy"),flush=True)
          print("TEST_RUNNER_LABELS_OK",{"self-hosted","Windows","X64"}.issubset(set(labels)),flush=True)
          ids=(40877767633,40878061200)
          for rid in ids:
              runs=get("/repos/anwpustudent-lab/Test/actions/runs/"+str(rid)+"/jobs?per_page=10")
              jobs=runs.get("jobs",[])
              print("RUN_QUEUE_STATUS",rid,[(x.get("status"),x.get("conclusion"))
                    for x in jobs],flush=True)
          print("RUNNER_HEALTH_READ_COMPLETE",flush=True)
          PY
