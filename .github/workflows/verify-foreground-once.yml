name: One-time verify foreground monitor-only recovery (NO dispatch)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-foreground-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  invoke:
    if: github.ref == 'refs/heads/main' && github.actor == 'chaonpu'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Invoke existing completed Stock canary monitor WITHOUT dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run stock-noop-pilot.yml --repo chaonpu/Runner --ref main \
            -f business_date=2026-10-17 -f mode=monitor_only
          echo 'Triggered monitor_only on an already completed historical canary.'
          echo 'No workflow_dispatch to private Stock, no strategy and no database action.'
