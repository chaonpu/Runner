name: One-time manual-workflow migration verification

on:
  push:
    branches: [main]
    paths:
      - "scheduler/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public coordinator code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Run route, billing and permissions tests
        run: |
          rm .github/workflows/validate.yml
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inspect hosted balance evidence and Windows runner status (read only)
        if: github.actor == 'chaonpu'
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          BILLING_READ_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
          TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
        run: python3 -m scheduler.runtime_status
      - name: Read-only Android source and private runner preflight
        if: github.actor == 'chaonpu'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
          TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
        run: python3 -m scheduler.android_production
      - name: Enforce public repository secrets boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          wf = root / '.github/workflows/scheduler.yml'
          if wf.exists():
              text = wf.read_text()
              assert 'pull_request:' not in text and 'pull_request_target:' not in text
              assert 'contents: write' not in text
          config = (root / 'config/repositories.json').read_text()
          assert not re.search(r'gh[pousr]_[a-zA-Z0-9]{20,}', config)
          print('Public source and token exposure guardrails passed.')
          PY
      - name: Inspect both manual strategy readiness paths without dispatching
        if: github.actor == 'chaonpu'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json
          from scheduler.production_ports import ReadOnlyPorts, public_report
          from scheduler.exchange_schedule import evaluate
          ports = ReadOnlyPorts(os.environ)
          cfg, state, _ = ports.load()
          for task in ('stock_a', 'stock_us'):
              day = evaluate(task)['businessDate']
              print(json.dumps(public_report(cfg, state, ports.audit(cfg, state, task, day)), sort_keys=True))
          PY
