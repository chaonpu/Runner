name: Runner scheduler safety tests

on:
  push:
    branches: [main]
    paths:
      - "scheduler/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public coordinator code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Run route, billing and permissions tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inspect hosted balance evidence and Windows runner status (read only)
        if: github.actor == 'chaonpu'
        env:
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          BILLING_READ_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          TEST_ACTIONS_READ_TOKEN: ${{ secrets.TEST_ACTIONS_READ_TOKEN }}
          TEST_BILLING_READ_TOKEN: ${{ secrets.TEST_BILLING_READ_TOKEN }}
          TEST_RUNNER_READ_TOKEN: ${{ secrets.TEST_RUNNER_READ_TOKEN }}
        run: python3 -m scheduler.runtime_status
      - name: One-time live read-only production adapter acceptance
        # Removed after verification; no private contents, artifacts or logs.
        if: github.actor == 'chaonpu'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAONPU_ACTIONS_READ_TOKEN: ${{ secrets.CHAONPU_ACTIONS_READ_TOKEN }}
          CHAONPU_BILLING_READ_TOKEN: ${{ secrets.CHAONPU_BILLING_READ_TOKEN }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        run: |
          python3 -m scheduler.production_ports --task stock_a
          python3 -m scheduler.production_ports --task stock_us
      - name: Enforce public repository secrets boundary (original)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          wf = root / '.github/workflows/scheduler.yml'
          if wf.exists():
              text = wf.read_text()
              assert 'pull_request:' not in text and 'pull_request_target:' not in text
              assert 'contents: write' not in text
          config = (root / 'config/repositories.json').read_text()
          assert not re.search(r'gh[pousr]_[a-zA-Z0-9]{20,}', config)
          print('Public source and token exposure guardrails passed.')
          PY

